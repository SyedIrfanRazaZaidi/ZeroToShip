<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Project Collaboration | Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">CIS Project Hub</h1>
            <div class="space-x-4 flex items-center">
                <a href="/" class="hover:text-blue-200 underline">Marketplace</a>
                <a href="/dashboard.html" class="hover:text-blue-200">My Dashboard</a>
                <button onclick="testLogin()" class="bg-blue-800 hover:bg-blue-900 px-3 py-1 rounded text-sm font-bold ml-4">Quick Login</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 mt-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Discovery Marketplace</h2>
            <input type="text" id="search-input" placeholder="Search skills (e.g. Flask)..." class="p-2 border border-gray-300 rounded-md w-64">
        </div>

        <!-- The grid will now populate from the database automatically -->
        <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        // Phase 5: Fetch from Database
        async function fetchProjects(query = '') {
            const url = query ? `/api/projects?skill=${query}` : '/api/projects';
            const res = await fetch(url);
            const data = await res.json();
            const container = document.getElementById('projects-container');
            container.innerHTML = ''; // Clear mock data
            
            if(data.length === 0) container.innerHTML = '<p class="text-gray-500">No projects found.</p>';

            data.forEach(p => {
                container.innerHTML += `
                <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100 hover:shadow-lg transition flex flex-col justify-between">
                    <div>
                        <h3 class="text-xl font-bold mb-2">${p.title}</h3>
                        <p class="text-gray-600 mb-4 h-20 overflow-hidden">${p.description}</p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${p.required_skills}</span>
                        </div>
                    </div>
                    <button onclick="applyForProject(${p.project_id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">Apply Now</button>
                </div>`;
            });
        }

        // Phase 5: Apply to project hook
        async function applyForProject(projectId) {
            const res = await fetch('/api/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ project_id: projectId })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        // Quick login for testing End-to-End
        async function testLogin() {
            const email = prompt("Enter User Email:");
            const password = prompt("Enter Password:");
            const res = await fetch('/login', {
                method: 'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({email, password})
            });
            if(res.ok) alert("Logged in successfully! You can now apply.");
            else alert("Login failed. Check database credentials.");
        }

        // Setup Search Filter Hook
        document.getElementById('search-input').addEventListener('keyup', (e) => fetchProjects(e.target.value));

        // Load DB projects on startup
        fetchProjects();
    </script>
</body>
</html>
