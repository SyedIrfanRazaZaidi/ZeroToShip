<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Peer Project Collaboration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">CIS Project Hub</h1>
            <div class="space-x-4">
                <a href="/" class="hover:text-blue-200">Marketplace</a>
                <a href="/dashboard.html" class="hover:text-blue-200 underline">My Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 mt-6 max-w-4xl">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">Project Manager Dashboard</h2>
        <p class="text-gray-600 mb-8">Review live applications to your projects.</p>

        <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100 mb-8">
            <h4 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Live Applicant Feed</h4>
            
            <!-- Applicants will populate here dynamically -->
            <div id="applicants-container" class="space-y-4">
                <p class="text-gray-500 italic" id="loading-msg">Loading applicants from database...</p>
            </div>
        </div>
    </main>

    <script>
        // Phase 5: Fetch live dashboard data
        async function loadDashboard() {
            const res = await fetch('/api/dashboard');
            if(!res.ok) {
                document.getElementById('loading-msg').innerText = "Please login first to view your dashboard.";
                return;
            }
            const data = await res.json();
            const container = document.getElementById('applicants-container');
            container.innerHTML = ''; 

            if(data.applications.length === 0) {
                container.innerHTML = '<p class="text-gray-500 italic">No applications found for your projects yet.</p>';
                return;
            }

            data.applications.forEach(app => {
                let statusColor = app.status === 'Approved' ? 'text-green-600' : (app.status === 'Rejected' ? 'text-red-600' : 'text-yellow-600');
                
                container.innerHTML += `
                <div class="flex justify-between items-center p-4 bg-gray-50 rounded-md border border-gray-200">
                    <div>
                        <p class="font-bold text-lg">${app.name} <span class="text-sm font-normal text-blue-600 block sm:inline">(Applied for: ${app.title})</span></p>
                        <p class="text-sm text-gray-600">Department: ${app.department} | Skills: ${app.skills}</p>
                        <p class="text-sm font-bold mt-1">Status: <span class="${statusColor}">${app.status}</span></p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="updateStatus(${app.application_id}, 'Approved')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded font-semibold transition">Accept</button>
                        <button onclick="updateStatus(${app.application_id}, 'Rejected')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded font-semibold transition">Deny</button>
                    </div>
                </div>`;
            });
        }

        // Phase 5: Accept/Deny Hook
        async function updateStatus(appId, status) {
            const res = await fetch(`/api/applications/${appId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            if(res.ok) loadDashboard(); // Refresh the UI dynamically
        }

        loadDashboard();
    </script>
</body>
</html>
