<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS Hub | Creator Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <nav class="bg-indigo-900 text-white shadow-xl sticky top-0 z-40 border-b border-indigo-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold tracking-tight">CIS <span class="text-indigo-400 font-light">Hub</span></h1>
            <a href="/" class="text-indigo-200 hover:text-white transition font-medium text-sm flex items-center gap-2">
                ← Back to Marketplace
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-6 mt-12 max-w-5xl">
        <header class="mb-10">
            <h2 class="text-4xl font-extrabold text-slate-900 mb-2">Creator Dashboard</h2>
            <p class="text-slate-500 text-lg">Review applicant profiles and assemble your dream team.</p>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-8 py-5 border-b border-slate-200">
                <h4 class="text-lg font-extrabold text-slate-800">Applicant Queue</h4>
            </div>
            
            <div class="p-8">
                <div id="applicants-container" class="space-y-4">
                    <div class="flex justify-center items-center py-12">
                        <p class="text-slate-400 font-medium" id="loading-msg">Authenticating dashboard access...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const color = type === 'error' ? 'bg-rose-500' : 'bg-emerald-500';
            toast.className = `${color} text-white px-6 py-3 rounded-xl shadow-lg transform transition-all duration-300 font-medium`;
            toast.innerText = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.remove() }, 3000);
        }

        async function loadDashboard() {
            const res = await fetch('/api/dashboard');
            if(!res.ok) {
                document.getElementById('loading-msg').innerHTML = 'Access Denied. Please <a href="/" class="text-indigo-600 underline">return to the marketplace</a> and log in.';
                return;
            }
            
            const data = await res.json();
            const container = document.getElementById('applicants-container');
            container.innerHTML = ''; 

            if(data.applications.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 font-medium">No pending applications for your projects yet.</div>';
                return;
            }

            data.applications.forEach(app => {
                let statusBadge = '';
                if(app.status === 'Approved') statusBadge = '<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-md text-xs font-bold border border-emerald-200">Approved</span>';
                else if(app.status === 'Rejected') statusBadge = '<span class="bg-rose-100 text-rose-800 px-3 py-1 rounded-md text-xs font-bold border border-rose-200">Rejected</span>';
                else statusBadge = '<span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-md text-xs font-bold border border-amber-200">Pending Review</span>';
                
                container.innerHTML += `
                <div class="flex flex-col md:flex-row justify-between md:items-center p-6 bg-slate-50 rounded-xl border border-slate-200 hover:border-indigo-300 transition gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-4 mb-2">
                            <p class="font-extrabold text-xl text-slate-900">${app.name}</p>
                            ${statusBadge}
                        </div>
                        <p class="text-sm text-indigo-700 font-bold mb-3 uppercase tracking-wide">Target: ${app.title}</p>
                        <div class="flex gap-4 text-sm text-slate-600 bg-white p-3 rounded-lg border border-slate-200 inline-flex">
                            <p><span class="font-bold text-slate-800">Dept:</span> ${app.department}</p>
                            <span class="text-slate-300">|</span>
                            <p><span class="font-bold text-slate-800">Tech Stack:</span> ${app.skills}</p>
                        </div>
                    </div>
                    
                    <div class="flex space-x-3 mt-4 md:mt-0 border-l border-slate-200 pl-6">
                        <button onclick="updateStatus(${app.application_id}, 'Approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-bold shadow-sm transition">Accept</button>
                        <button onclick="updateStatus(${app.application_id}, 'Rejected')" class="bg-white text-rose-600 hover:bg-rose-50 border border-rose-200 px-6 py-2.5 rounded-lg font-bold shadow-sm transition">Decline</button>
                    </div>
                </div>`;
            });
        }

        async function updateStatus(appId, status) {
            const res = await fetch(`/api/applications/${appId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            if(res.ok) {
                showToast(`Application ${status}!`);
                loadDashboard(); 
            }
        }

        loadDashboard();
    </script>
</body>
</html>
